<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cortexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="100" height="100" rx="22" fill="#0D0F14" />
  <rect x="2" y="2" width="96" height="96" rx="20" stroke="url(#cortexGrad)" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Neural Shield Outline -->
  <path d="M50 16 L80 30 V56 L50 84 L20 56 V30 Z" fill="url(#cortexGrad)" fill-opacity="0.12" stroke="url(#cortexGrad)" stroke-width="2.5" />
  
  <!-- Neural Network Connections -->
  <g filter="url(#glow)" stroke="url(#cortexGrad)" stroke-width="2.5" stroke-linecap="round">
    <line x1="50" y1="32" x2="34" y2="44" />
    <line x1="50" y1="32" x2="66" y2="44" />
    <line x1="34" y1="44" x2="30" y2="60" />
    <line x1="66" y1="44" x2="70" y2="60" />
    <line x1="34" y1="44" x2="50" y2="52" />
    <line x1="66" y1="44" x2="50" y2="52" />
    <line x1="50" y1="52" x2="40" y2="68" />
    <line x1="50" y1="52" x2="60" y2="68" />
    <line x1="30" y1="60" x2="40" y2="68" />
    <line x1="70" y1="60" x2="60" y2="68" />
    <line x1="40" y1="68" x2="60" y2="68" />
  </g>
  
  <!-- Glowing Synapse Nodes -->
  <g>
    <circle cx="50" cy="32" r="4.5" fill="#FFFFFF" />
    <circle cx="34" cy="44" r="4" fill="#A855F7" />
    <circle cx="66" cy="44" r="4" fill="#A855F7" />
    <circle cx="50" cy="52" r="5" fill="#FFFFFF" />
    <circle cx="30" cy="60" r="3.5" fill="#6366F1" />
    <circle cx="70" cy="60" r="3.5" fill="#6366F1" />
    <circle cx="40" cy="68" r="4" fill="#EC4899" />
    <circle cx="60" cy="68" r="4" fill="#EC4899" />
  </g>
</svg>